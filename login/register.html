<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register JonoWebsite</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#00ffff,#006666);
overflow:hidden;
}

/* bubble background */
body::before,
body::after{
content:'';
position:absolute;
width:400px;
height:400px;
border-radius:50%;
background:rgba(255,255,255,.08);
animation:float 6s ease-in-out infinite;
}

body::before{
top:-120px;
left:-120px;
}

body::after{
bottom:-120px;
right:-120px;
animation-delay:2s;
}

@keyframes float{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(30px);
}
}

/* register box */
.main_div{
width:400px;
padding:35px;
border-radius:20px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(18px);
box-shadow:0 20px 40px rgba(0,0,0,.2);
z-index:10;
animation:fadeUp 1s ease;
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.title{
text-align:center;
font-size:32px;
font-weight:700;
color:white;
margin-bottom:25px;
}

/* social */
.social_icons{
display:flex;
gap:10px;
margin-bottom:20px;
}

.social_icons a{
flex:1;
padding:12px;
border-radius:10px;
text-decoration:none;
text-align:center;
background:rgba(255,255,255,.18);
color:white;
transition:.3s;
}

.social_icons a:hover{
transform:translateY(-3px);
background:rgba(255,255,255,.28);
}

/* input */
.input_box{
position:relative;
margin-bottom:18px;
}

.input_box input{
width:100%;
padding:14px 45px 14px 14px;
border:none;
outline:none;
border-radius:12px;
background:rgba(255,255,255,.16);
color:white;
font-size:15px;
transition:.3s;
}

.input_box input::placeholder{
color:#eaffff;
}

.input_box input:focus{
background:rgba(255,255,255,.25);
transform:scale(1.02);
}

.icon{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
color:white;
}

/* button */
.button input{
background:white;
color:#008b8b;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.button input:hover{
transform:translateY(-3px);
box-shadow:0 10px 20px rgba(0,0,0,.2);
}

.button input:active{
transform:scale(.96);
}

/* message */
#message{
text-align:center;
margin-bottom:15px;
font-size:14px;
color:white;
min-height:20px;
}

/* sign in */
.sign_up{
text-align:center;
margin-top:15px;
color:#eaffff;
font-size:14px;
}

.sign_up a{
color:white;
font-weight:bold;
text-decoration:none;
}

</style>
</head>

<body>

<div class="main_div">

<div class="title">Register Form</div>

<div class="social_icons">
<a href="#"><i class="fab fa-facebook-f"></i> Facebook</a>
<a href="#"><i class="fab fa-twitter"></i> Twitter</a>
</div>

<div id="message"></div>

<form id="registerForm">

<div class="input_box">
<input type="text" id="username" placeholder="Username" required>
<div class="icon">
<i class="fas fa-user"></i>
</div>
</div>

<div class="input_box">
<input type="email" id="email" placeholder="Email" required>
<div class="icon">
<i class="fas fa-envelope"></i>
</div>
</div>

<div class="input_box">
<input type="password" id="password" placeholder="Password" required>
<div class="icon">
<i class="fas fa-lock"></i>
</div>
</div>

<div class="input_box button">
<input type="submit" value="Register">
</div>

<div class="sign_up">
Sudah punya akun?
<a href="index.html">Sign In</a>
</div>

</form>

</div>

<!-- REGISTER JS -->
<script src="js/register.js"></script>

</body>
</html>
